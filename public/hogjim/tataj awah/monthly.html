<script>
const SUPABASE_URL = window.SUPABASE_URL || "https://dehxrmupnbilwlxsovpi.supabase.co";
const SUPABASE_KEY = window.SUPABASE_KEY || "sb_publishable_VRNBeM9nqwFlrDhT2-wD3w_Gp3O85uy";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let OVERRIDES = {}; // { "level-month": {theme, newSong, ...} }

async function loadOverrides() {
  const { data } = await sb.from('monthly_matrix').select('*');
  OVERRIDES = {};
  for (const r of (data||[])) OVERRIDES[`${r.level}-${r.month}`] = r.data || {};
}
function getMonthData(lvl, mon) {
  const base = (MONTHLY[lvl] && MONTHLY[lvl][mon]) || {theme:'',newSong:'',repeatSong:'',listening:'',movement:'',game:'',rhythm:'',voiceExercise:'',newCode:'',cross:[]};
  const ov = OVERRIDES[`${lvl}-${mon}`] || {};
  return {...base, ...ov};
}
async function saveOverride(lvl, mon, data) {
  await sb.from('monthly_matrix').upsert({level:parseInt(lvl), month:parseInt(mon), data, updated_at:new Date().toISOString()});
  OVERRIDES[`${lvl}-${mon}`] = data;
}
function openEditor() {
  const lvl = document.getElementById("lvl").value;
  const mon = document.getElementById("mon").value;
  const m = getMonthData(lvl, mon);
  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto";
  const field = (label, key, textarea) => `
    <div style="margin-bottom:10px">
      <label style="display:block;font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:600">${label}</label>
      ${textarea?`<textarea id="ed-${key}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;min-height:60px">${(m[key]||'').replace(/</g,'&lt;')}</textarea>`
      :`<input id="ed-${key}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit" value="${(m[key]||'').replace(/"/g,'&quot;')}">`}
    </div>`;
  modal.innerHTML = `
    <div style="background:white;padding:24px;border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
      <h3 style="margin-bottom:14px;font-size:16px">✏️ ${mon}-р сарын төлөвлөгөө засах</h3>
      ${field('🎯 Гол сэдэв','theme',true)}
      ${field('🎵 Шинэ дуу','newSong')}
      ${field('🔁 Давтах дуу','repeatSong')}
      ${field('👂 Сонсох хөгжим','listening',true)}
      ${field('💃 Хөгжимт хөдөлгөөн','movement',true)}
      ${field('🎮 Тоглоом','game',true)}
      ${field('🥁 Хэмнэл','rhythm',true)}
      ${field('🎤 Хоолойны дасгал','voiceExercise',true)}
      ${field('📌 СҮД код','newCode')}
      ${field('🔗 Уялдаа (таслалаар тусгаарла)','crossStr')}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button onclick="this.closest('div[style*=fixed]').remove()" style="padding:8px 16px;background:#f3f4f6;border:none;border-radius:6px;cursor:pointer">Болих</button>
        <button onclick="saveEditor()" style="padding:8px 16px;background:#10b981;color:white;border:none;border-radius:6px;cursor:pointer">💾 Хадгалах</button>
      </div>
    </div>`;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
  document.getElementById("ed-crossStr").value = (m.cross||[]).join(", ");
}
async function saveEditor() {
  const lvl = document.getElementById("lvl").value;
  const mon = document.getElementById("mon").value;
  const keys = ['theme','newSong','repeatSong','listening','movement','game','rhythm','voiceExercise','newCode'];
  const data = {};
  keys.forEach(k => data[k] = document.getElementById("ed-"+k).value.trim());
  data.cross = document.getElementById("ed-crossStr").value.split(",").map(s=>s.trim()).filter(Boolean);
  await saveOverride(lvl, mon, data);
  document.querySelector("div[style*=fixed]").remove();
  render();
}
async function saveToSystem() {
  const lvl = document.getElementById("lvl").value;
  const mon = document.getElementById("mon").value;
  const m = getMonthData(lvl, mon);
  const groupMap = {1:'baga',2:'dund',3:'ahlah',4:'beltgel'};
  const groupNames = {1:'Бага',2:'Дунд',3:'Ахлах',4:'Бэлтгэл'};
  const gid = groupMap[lvl];
  if (!confirm(`${groupNames[lvl]} бүлгийн ${mon}-р сарын төлөвлөгөөг системд хадгалах уу?\n\nАрга зүйч харах, батлах боломжтой болно.`)) return;
  // Word файлыг Supabase Storage-т upload
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><style>' +
    document.querySelector("style").innerText + '</style></head><body>' + document.getElementById("plan").outerHTML + '</body></html>';
  const blob = new Blob(['﻿'+html], {type:'application/msword;charset=utf-8'});
  const fname = `${Date.now()}-${gid}-month${mon}.doc`;
  const { error: upErr } = await sb.storage.from('media').upload(fname, blob);
  if (upErr) { alert("Файл хадгалахад алдаа: "+upErr.message); return; }
  const { data: {publicUrl} } = sb.storage.from('media').getPublicUrl(fname);
  const content = `🎯 Гол сэдэв: ${m.theme}\n🎵 Шинэ дуу: ${m.newSong}\n🔁 Давтах дуу: ${m.repeatSong}\n👂 Сонсох хөгжим: ${m.listening}\n💃 Хөгжимт хөдөлгөөн: ${m.movement}\n🎮 Тоглоом: ${m.game}\n🥁 Хэмнэл: ${m.rhythm}\n🎤 Хоолойны дасгал: ${m.voiceExercise}`;
  const { error: insErr } = await sb.from('plans').insert({
    group_id: gid, tab: 'monthly',
    title: `${groupNames[lvl]} бүлгийн ${mon}-р сарын төлөвлөгөө`,
    period: `${mon}-р сар`,
    goal: m.newCode,
    content: content,
    files: [{ src: publicUrl, label: `${groupNames[lvl]}_${mon}сар_төлөвлөгөө.doc` }]
  });
  if (insErr) { alert("Хадгалахад алдаа: "+insErr.message); return; }
  alert(`✅ Амжилттай! Одоо системийн Хөтөлбөр төлөвлөгөө → ${groupNames[lvl]} бүлэг → Сарын tab-т орсон байгаа.\n\nАрга зүйч нэвтэрч батлах боломжтой боллоо.`);
}
async function resetMonth() {
  const lvl = document.getElementById("lvl").value;
  const mon = document.getElementById("mon").value;
  if (!confirm(`${mon}-р сарын өөрчлөлтийг цуцлаад автомат загварт эргүүлэх үү?`)) return;
  await sb.from('monthly_matrix').delete().eq('level',parseInt(lvl)).eq('month',parseInt(mon));
  delete OVERRIDES[`${lvl}-${mon}`];
  render();
}

function update() {
  const lvl = document.getElementById("lvl").value;
  const mon = document.getElementById("mon").value;
  location.hash = `${lvl}-${mon}`;
  render();
}
function downloadDoc() {
  const lvl = document.getElementById("lvl").value;
  const mon = document.getElementById("mon").value;
  const names = {1:"бага",2:"дунд",3:"ахлах",4:"бэлтгэл"};
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><style>' +
    document.querySelector("style").innerText +
    '</style></head><body>' + document.getElementById("plan").outerHTML + '</body></html>';
  const blob = new Blob(['﻿'+html], {type:'application/msword;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${names[lvl]}_${mon}сар_төлөвлөгөө.doc`;
  a.click();
  URL.revokeObjectURL(url);
}
// URL hash-с эхлэх утга
const h = location.hash.slice(1).split("-");
if (h[0] && LEVELS[h[0]]) document.getElementById("lvl").value = h[0];
if (h[1]) document.getElementById("mon").value = h[1];
(async () => {
  try { await loadOverrides(); } catch(e) { console.error(e); }
  render();
})();
</script>
