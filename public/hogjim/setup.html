<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Хөгжим Өлзий — Автомат суулгагч</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0 }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg,#fce7f3 0%,#ddd6fe 50%,#bfdbfe 100%);
    min-height:100vh; color:#1e293b; padding:20px }
  .container { max-width:800px; margin:0 auto; background:white; border-radius:20px;
    padding:32px; box-shadow:0 20px 60px rgba(139,92,246,0.15); margin-top:20px }
  .header { text-align:center; margin-bottom:28px; padding-bottom:24px; border-bottom:2px solid #f3f4f6 }
  .header .logo { font-size:56px; margin-bottom:8px }
  .header h1 { font-size:26px; font-weight:800;
    background:linear-gradient(135deg,#be185d,#7c3aed);
    -webkit-background-clip:text; background-clip:text; color:transparent }
  .header p { color:#64748b; font-size:14px; margin-top:6px }

  .steps { display:flex; gap:6px; margin-bottom:24px; overflow-x:auto; padding-bottom:6px }
  .step { flex:1; min-width:80px; text-align:center; padding:10px 6px;
    border-radius:8px; font-size:12px; color:#64748b; background:#f1f5f9; font-weight:600 }
  .step.active { background:linear-gradient(135deg,#ec4899,#8b5cf6); color:white }
  .step.done { background:#dcfce7; color:#065f46 }

  h2 { font-size:18px; font-weight:700; margin-bottom:8px; color:#1e293b }
  p.desc { color:#64748b; font-size:14px; margin-bottom:16px; line-height:1.6 }

  .form-group { margin-bottom:16px }
  .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#374151 }
  .form-group input { width:100%; padding:12px 14px; border:2px solid #e5e7eb;
    border-radius:10px; font-size:14px; font-family:inherit; transition:border-color 0.2s }
  .form-group input:focus { outline:none; border-color:#ec4899 }
  .form-group .hint { font-size:12px; color:#64748b; margin-top:4px }

  .btn { background:linear-gradient(135deg,#ec4899,#8b5cf6); color:white; border:none;
    padding:14px 24px; border-radius:10px; font-size:15px; font-weight:600;
    cursor:pointer; transition:all 0.2s; font-family:inherit }
  .btn:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(236,72,153,0.35) }
  .btn:disabled { opacity:0.5; cursor:wait; transform:none }
  .btn-secondary { background:white; color:#374151; border:2px solid #e5e7eb }
  .btn-secondary:hover { background:#f9fafb; box-shadow:none; transform:none }
  .btn-success { background:linear-gradient(135deg,#10b981,#059669) }

  .info-box { background:#eff6ff; border-left:4px solid #3b82f6; padding:12px 16px;
    border-radius:8px; margin:14px 0; font-size:13px; color:#1e40af; line-height:1.6 }
  .warn-box { background:#fef3c7; border-left:4px solid #f59e0b; padding:12px 16px;
    border-radius:8px; margin:14px 0; font-size:13px; color:#78350f; line-height:1.6 }
  .error-box { background:#fef2f2; border-left:4px solid #dc2626; padding:12px 16px;
    border-radius:8px; margin:14px 0; font-size:13px; color:#7f1d1d; line-height:1.6 }
  .success-box { background:#f0fdf4; border-left:4px solid #10b981; padding:12px 16px;
    border-radius:8px; margin:14px 0; font-size:13px; color:#065f46; line-height:1.6 }

  .progress { margin:20px 0 }
  .progress-item { display:flex; gap:10px; padding:10px 14px; border-radius:8px;
    margin-bottom:6px; background:#f9fafb; font-size:13px; align-items:center }
  .progress-item.doing { background:#eff6ff; color:#1e40af }
  .progress-item.done { background:#dcfce7; color:#065f46 }
  .progress-item.fail { background:#fef2f2; color:#7f1d1d }
  .progress-item .ico { font-size:18px }

  code { background:#f3f4f6; padding:2px 8px; border-radius:4px; font-family:"Consolas",monospace;
    font-size:12px; color:#be185d }
  .code-block { background:#1e293b; color:#e2e8f0; padding:14px; border-radius:8px;
    font-family:monospace; font-size:11px; overflow-x:auto; margin:10px 0; line-height:1.5 }

  .actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap }
  .actions .btn { flex:1; min-width:120px }

  a { color:#7c3aed; font-weight:600; text-decoration:none }
  a:hover { text-decoration:underline }

  ol, ul { padding-left:22px; margin:8px 0 }
  li { margin:4px 0 }
</style></head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">🎵✨</div>
    <h1>ХӨГЖИМ ӨЛЗИЙ — Автомат суулгагч</h1>
    <p>10 минутын дотор өөрийн системтэй болно</p>
  </div>

  <div class="steps">
    <div class="step" data-step="1">1. Танилцах</div>
    <div class="step" data-step="2">2. Supabase</div>
    <div class="step" data-step="3">3. Мэдээллийн сан</div>
    <div class="step" data-step="4">4. Тохиргоо</div>
    <div class="step" data-step="5">5. Дуусгах</div>
  </div>

  <div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let currentStep = 1;
let sb = null;
let SUPABASE_URL = "";
let SUPABASE_KEY = "";
let TEACHER_NAME = "";

function setStep(n) {
  currentStep = n;
  document.querySelectorAll('.step').forEach(s => {
    const num = parseInt(s.dataset.step);
    s.classList.toggle('active', num === n);
    s.classList.toggle('done', num < n);
  });
  render();
}

function render() {
  const c = document.getElementById("content");
  if (currentStep === 1) c.innerHTML = renderStep1();
  else if (currentStep === 2) c.innerHTML = renderStep2();
  else if (currentStep === 3) c.innerHTML = renderStep3();
  else if (currentStep === 4) c.innerHTML = renderStep4();
  else if (currentStep === 5) c.innerHTML = renderStep5();
}

function renderStep1() {
  return `
    <h2>👋 Тавтай морил!</h2>
    <p class="desc">Хөгжмийн багш нарт зориулсан бүрэн систем — өөрийн Gmail-ээр 3 үнэгүй үйлчилгээ ашиглаж 10 минутын дотор суулгана.</p>

    <div class="info-box">
      <strong>🎁 Танд юу орж ирэх вэ:</strong>
      <ul>
        <li>Хөтөлбөр төлөвлөгөө · Жилийн матриц · Сарын үүсгэгч</li>
        <li>173 ерөнхий + 60+ хөгжмийн шалгуур</li>
        <li>104 бэлэн дуу · 32 хөгжмийн зэмсэг</li>
        <li>Багш · Эцэг эх · Арга зүйчийн 3 нэвтрэлт</li>
        <li>Push notification · Excel/Word/PDF татах</li>
        <li>Гэрчилгээ үүсгэгч · Портфолио · Сарын тайлан</li>
      </ul>
    </div>

    <div class="warn-box">
      <strong>⚠️ Бэлэн байх зүйлс:</strong>
      <ul>
        <li>✅ Компьютер + интернэт</li>
        <li>✅ Gmail хаяг</li>
        <li>✅ 10-15 минутын чөлөөт цаг</li>
      </ul>
    </div>

    <h3 style="margin-top:20px;font-size:15px">📝 Хийх алхмуудын товч агуулга:</h3>
    <ol style="font-size:13px;color:#374151">
      <li><strong>Supabase</strong> данс + төсөл үүсгэх (2-3 мин)</li>
      <li>API түлхүүрээ энэ хуудсанд оруулах</li>
      <li>Мэдээллийн сан <strong>автомат үүснэ</strong> (1 мин)</li>
      <li>Багшийн нэрээ оруулах</li>
      <li>Тохирсон <code>index.html</code> файлыг татах</li>
      <li>GitHub + Netlify-т байрлуулах (5 мин)</li>
    </ol>

    <div class="actions">
      <button class="btn" onclick="setStep(2)">🚀 Эхлэх</button>
    </div>`;
}

function renderStep2() {
  return `
    <h2>🔑 Алхам 2: Supabase түлхүүрээ оруулна уу</h2>
    <p class="desc">Supabase — мэдээллийн сан (үнэгүй). Одоо танд байхгүй бол доорх заавраар үүсгэ.</p>

    <details style="background:#f9fafb;padding:14px;border-radius:10px;margin-bottom:14px">
      <summary style="cursor:pointer;font-weight:600;color:#7c3aed">📖 Supabase төсөл яаж үүсгэх вэ?</summary>
      <ol style="font-size:13px;margin-top:10px;line-height:1.8">
        <li><a href="https://supabase.com" target="_blank">supabase.com</a> руу оч → <strong>Start your project</strong></li>
        <li>GitHub эсвэл Google-ээр нэвтэр</li>
        <li><strong>New project</strong> дар → нэр: <code>hugjim</code>, нууц код зохио</li>
        <li>Region: <strong>Northeast Asia (Tokyo)</strong> сонго</li>
        <li>Free plan сонго → <strong>Create</strong></li>
        <li>1-2 минут хүлээ, дараа Settings → API → 2 утга хуул</li>
      </ol>
    </details>

    <div class="form-group">
      <label>🔗 Project URL</label>
      <input id="url" placeholder="https://xxxxx.supabase.co" value="${SUPABASE_URL}">
      <div class="hint">Жишээ: https://abcdefghij.supabase.co</div>
    </div>

    <div class="form-group">
      <label>🔐 anon / publishable key</label>
      <input id="key" placeholder="sb_publishable_..." value="${SUPABASE_KEY}">
      <div class="hint">⚠️ <code>service_role</code> биш! Зөвхөн <code>anon</code> эсвэл <code>publishable</code></div>
    </div>

    <div id="testResult"></div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="setStep(1)">← Буцах</button>
      <button class="btn" onclick="testConnection()" id="testBtn">🔍 Холболт шалгах</button>
    </div>`;
}

async function testConnection() {
  let url = document.getElementById("url").value.trim();
  // Автоматаар /rest/v1/ болон бусад суффиксийг арилгах
  url = url.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
  document.getElementById("url").value = url;
  const key = document.getElementById("key").value.trim();
  const res = document.getElementById("testResult");
  const btn = document.getElementById("testBtn");
  if (!url || !key) { res.innerHTML = '<div class="error-box">URL болон түлхүүрийг оруулна уу</div>'; return; }
  btn.disabled = true; btn.textContent = '⏳ Шалгаж байна...';
  try {
    const client = supabase.createClient(url, key);
    const { error } = await client.from('_test_dummy_').select('*').limit(1);
    // Даалгаварт хэрэглэдэг table байхгүй ч холболт ажилладаг гэсэн үг
    if (error && !error.message.includes('does not exist')
             && !error.message.includes('Not Found')
             && !error.message.includes('Could not find the table')
             && !error.message.includes('schema cache')
             && error.code !== 'PGRST116' && error.code !== '42P01') {
      throw new Error(error.message);
    }
    sb = client;
    SUPABASE_URL = url;
    SUPABASE_KEY = key;
    res.innerHTML = '<div class="success-box">✅ Холболт амжилттай! Дараагийн алхам руу орно уу.</div>';
    setTimeout(() => setStep(3), 1200);
  } catch (e) {
    res.innerHTML = `<div class="error-box">❌ Холболт амжилтгүй: ${e.message}<br>URL болон түлхүүрийг шалгаад дахин оролдоно уу.</div>`;
    btn.disabled = false; btn.textContent = '🔍 Холболт шалгах';
  }
}

function renderStep3() {
  return `
    <h2>💾 Алхам 3: Мэдээллийн сан үүсгэх</h2>
    <p class="desc">Дараах товчийг дарахад <strong>24 хүснэгт</strong> болон <strong>Storage bucket</strong> автомат үүснэ. 30-60 секунд болно.</p>

    <div class="warn-box">
      Энэ үйлдэл <strong>1 удаа л</strong> хийгддэг. Хэрэв дахин ажиллуулбал өгөгдөл алдагдахгүй (табл байгаа бол алгасана).
    </div>

    <div id="progress" class="progress"></div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="setStep(2)">← Буцах</button>
      <button class="btn" onclick="runMigrations()" id="migBtn">🚀 Мэдээллийн сан үүсгэх</button>
    </div>`;
}

async function runMigrations() {
  const btn = document.getElementById("migBtn");
  const box = document.getElementById("progress");
  btn.disabled = true; btn.textContent = '⏳ Ажиллаж байна...';

  const steps = [
    { name: "🗂 Үндсэн хүснэгтүүд үүсгэх", sql: MIGRATIONS.core },
    { name: "🔒 Аюулгүй байдлын дүрэм", sql: MIGRATIONS.policies },
    { name: "⚙️ Үндсэн тохиргоо", sql: MIGRATIONS.settings },
    { name: "🎼 32 хөгжмийн зэмсэг оруулах", sql: MIGRATIONS.instruments },
    { name: "🎵 104 дуу, хөдөлгөөн, сонсох хөгжим", sql: MIGRATIONS.songs }
  ];

  box.innerHTML = steps.map((s, i) => `
    <div class="progress-item" id="pi-${i}"><span class="ico">⏳</span><span>${s.name}</span></div>
  `).join("");

  let failed = false;
  for (let i = 0; i < steps.length; i++) {
    const el = document.getElementById("pi-"+i);
    el.className = 'progress-item doing';
    el.querySelector('.ico').textContent = '🔄';
    try {
      const { error } = await sb.rpc('exec_sql', { sql_query: steps[i].sql });
      if (error) throw error;
      el.className = 'progress-item done';
      el.querySelector('.ico').textContent = '✅';
    } catch (e) {
      // Хэрэв exec_sql RPC байхгүй бол алдаа гарна — багшид гараар ажиллуулахыг санал болгоё
      el.className = 'progress-item fail';
      el.querySelector('.ico').textContent = '⚠️';
      el.querySelector('span:last-child').textContent += ' — гараар ажиллуулах шаардлагатай';
      failed = true;
    }
  }

  if (failed) {
    box.innerHTML += `
      <div class="warn-box" style="margin-top:14px">
        <strong>ℹ️ Автомат ажиллах боломжгүй байна.</strong><br>
        Supabase-ийн RPC функц ажилладаггүй болохоор доор SQL-ыг гараар ажиллуулна уу:
        <ol style="margin-top:8px">
          <li>Supabase → <strong>SQL Editor</strong> → <strong>New query</strong></li>
          <li>Доорх кодыг хуулж буулга → <strong>Run</strong></li>
        </ol>
        <button class="btn" style="margin-top:10px;padding:8px 16px" onclick="showFullSQL()">📋 Бүх SQL харах / хуулах</button>
      </div>`;
    btn.textContent = '✅ Гараар хийсний дараа дараагийн алхам';
    btn.disabled = false;
    btn.onclick = () => setStep(4);
  } else {
    box.innerHTML += '<div class="success-box">🎉 Бүх мэдээллийн сан бэлэн боллоо!</div>';
    setTimeout(() => setStep(4), 1500);
  }
}

function showFullSQL() {
  const allSQL = Object.values(MIGRATIONS).join("\n\n");
  const w = window.open("");
  w.document.write(`<pre style="padding:20px;font-family:monospace;font-size:12px;white-space:pre-wrap">${allSQL.replace(/</g,'&lt;')}</pre>`);
  navigator.clipboard.writeText(allSQL).then(() => alert("✅ SQL код clipboard-т хуулагдлаа! Supabase → SQL Editor-т paste хийнэ үү."));
}

function renderStep4() {
  return `
    <h2>👤 Алхам 4: Багшийн мэдээлэл</h2>
    <p class="desc">Портфолио, эрхлэгчийн бичиг зэрэгт харагдах нэр.</p>

    <div class="form-group">
      <label>👩‍🏫 Багшийн овог, нэр</label>
      <input id="tname" placeholder="Ж: Г.Өлзийбаяр" value="${TEACHER_NAME}">
    </div>

    <div class="form-group">
      <label>🔐 Багшийн нууц код (нэвтрэхэд ашиглана)</label>
      <input id="tpw" type="text" value="Suwdaa1113">
      <div class="hint">Дараа ⚙️ Тохиргоо цэсээс солих боломжтой</div>
    </div>

    <div class="form-group">
      <label>🎓 Арга зүйчийн нууц код</label>
      <input id="mpw" type="text" value="ArgaZuich2026">
    </div>

    <div id="teacherResult"></div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="setStep(3)">← Буцах</button>
      <button class="btn" onclick="saveTeacher()" id="tBtn">💾 Хадгалах</button>
    </div>`;
}

async function saveTeacher() {
  const name = document.getElementById("tname").value.trim();
  const tpw = document.getElementById("tpw").value.trim();
  const mpw = document.getElementById("mpw").value.trim();
  const res = document.getElementById("teacherResult");
  const btn = document.getElementById("tBtn");
  if (!name || !tpw || !mpw) { res.innerHTML = '<div class="error-box">Бүх талбарыг бөглөнө үү</div>'; return; }
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    await sb.from('settings').upsert([
      {key:'teacher_password', value:tpw},
      {key:'methodist_password', value:mpw}
    ]);
    // Профайл үүсгэх
    const { data } = await sb.from('teacher_profile').select('id').limit(1).maybeSingle();
    if (data) await sb.from('teacher_profile').update({name, position:'Хөгжмийн багш'}).eq('id', data.id);
    else await sb.from('teacher_profile').insert({name, position:'Хөгжмийн багш'});
    // Storage bucket check
    try { await sb.storage.createBucket('media', {public:true}); } catch(e) {}
    TEACHER_NAME = name;
    res.innerHTML = '<div class="success-box">✅ Хадгалагдлаа!</div>';
    setTimeout(() => setStep(5), 1000);
  } catch (e) {
    res.innerHTML = `<div class="error-box">❌ Алдаа: ${e.message}<br>Мэдээллийн сан бэлэн болсон эсэхийг Алхам 3-т шалгана уу.</div>`;
    btn.disabled = false; btn.textContent = '💾 Хадгалах';
  }
}

function renderStep5() {
  return `
    <h2>🎉 Бэлэн боллоо!</h2>
    <p class="desc">Таны хувийн тохиргоотой файлыг татаж авч <strong>GitHub + Netlify</strong> дээр байрлуулна.</p>

    <div class="success-box">
      ✅ Мэдээллийн сан үүссэн<br>
      ✅ Багшийн нэр хадгалагдсан: <strong>${TEACHER_NAME}</strong><br>
      ✅ Дуу, зэмсэг бэлэн<br>
      ✅ Нууц код хадгалагдсан
    </div>

    <h3 style="margin-top:20px;font-size:15px">📥 Дараагийн алхмууд:</h3>
    <ol style="font-size:13px;line-height:1.8">
      <li><strong>config.js</strong> файлыг татаж ав (доорх товч)</li>
      <li>GitHub-т шинэ repo үүсгэ (жишээ: <code>hugjim-мянийнэр</code>)</li>
      <li>Багшаас өгсөн бүх файлыг + шинэ <code>config.js</code>-ыг хамт байрлуул</li>
      <li>Netlify-т GitHub-аар холбоод deploy</li>
    </ol>

    <div class="info-box">
      <strong>📞 Тусламж хэрэгтэй бол:</strong><br>
      ☎️ Багш Г.Өлзийбаяр: 8887-4686<br>
      ✉️ ulziibagshsistem01@gmail.com
    </div>

    <div class="actions">
      <button class="btn btn-success" onclick="downloadConfig()">📥 config.js татах</button>
      <button class="btn btn-secondary" onclick="showManual()">📖 Дэлгэрэнгүй заавар</button>
    </div>

    <div id="dlResult" style="margin-top:14px"></div>`;
}

function downloadConfig() {
  const content = `// Хөгжим Өлзий Систем — Тохиргоо
// Багш: ${TEACHER_NAME}
// Үүсгэсэн: ${new Date().toLocaleString('mn-MN')}
window.SUPABASE_URL = "${SUPABASE_URL}";
window.SUPABASE_KEY = "${SUPABASE_KEY}";
window.TEACHER_NAME = "${TEACHER_NAME}";
`;
  const blob = new Blob([content], {type:'text/javascript;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'config.js'; a.click();
  URL.revokeObjectURL(url);
  document.getElementById("dlResult").innerHTML = '<div class="success-box">✅ config.js татагдлаа! GitHub repo-т буулгана уу.</div>';
}

function showManual() {
  window.open('material_1_суулгах_заавар.html', '_blank');
