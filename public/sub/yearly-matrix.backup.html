<script>
// ═══════ SUPABASE ═══════
const SUPABASE_URL = window.SUPABASE_URL || "";
const SUPABASE_KEY = window.SUPABASE_KEY || "";
let sb = null;
if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

// ═══════ ӨГӨГДӨЛ ═══════
const SUBJECTS_LIST = [
  {id:"hel_yaria", name:"🗣️ Хэл яриа"},
  {id:"matematik", name:"🔢 Математик"},
  {id:"bno",       name:"🌍 БНО"},
  {id:"niigem",    name:"🤝 Нийгэмшихүй"},
  {id:"urlag",     name:"🎨 Урлаг, зураг"},
  {id:"hodolgoon", name:"🤸 Хөдөлгөөн"},
  {id:"aa_uhaan",  name:"🚦 Аюулгүй ухаан"}
];

const OUTCOMES_BAGA = {
  hel_yaria: [
    {code:"ХЯ1.1а",text:"Бусдын яриаг сонсоод үг, үйлдлээр илэрхийлнэ"},
    {code:"ХЯ1.1б",text:"Ярианд хэлсэн үгийг сонсож, давтан хэлнэ"},
    {code:"ХЯ1.2а",text:"Харилцан яриаг ажиглан үг, өгүүлбэрийг дуурайна"},
    {code:"ХЯ1.2б",text:"Ярилцах явцдаа асуулт асуух оролдлого хийнэ"},
    {code:"ХЯ1.2в",text:"Танил эд юмсыг нэрлэнэ"},
    {code:"ХЯ1.2г",text:"Хүсэл, хэрэгцээгээ үгээр илэрхийлнэ"},
    {code:"ХЯ1.2д",text:"Энгийн өгүүлбэрийг давтан хэлнэ"},
    {code:"ХЯ1.3а",text:"Номыг сонирхож үзнэ"},
    {code:"ХЯ1.3б",text:"Зурган тэмдэг тэмдэглэгээг таньж заана"},
    {code:"ХЯ1.3в",text:"Харандаа барьж, цаасан дээр мөр гаргана"}
  ],
  matematik: [
    {code:"МАТ1.1а",text:"1-3 хүртэлх тоог таньж нэрлэнэ"},
    {code:"МАТ1.1б",text:"Тоо болон юмсыг нэг-нэгээр тохируулна"},
    {code:"МАТ1.2а",text:"Дугуй, дөрвөлжин, гурвалжин хэлбэрийг ялгана"},
    {code:"МАТ1.2б",text:"Улаан, шар, хөх үндсэн өнгийг нэрлэнэ"},
    {code:"МАТ1.3а",text:"Том/жижиг, урт/богиныг ялгана"},
    {code:"МАТ1.3б",text:"Байрлал (дээр/доор/дунд) ойлгоно"}
  ],
  bno: [
    {code:"БНО1.1а",text:"Ойр орчны амьтдыг нэрлэнэ"},
    {code:"БНО1.1б",text:"Ойр орчны ургамлыг таньна"},
    {code:"БНО1.2а",text:"Улирлыг ажигладаг"},
    {code:"БНО1.2в",text:"Багшийн зааврыг биелүүлнэ"}
  ],
  niigem: [
    {code:"НСХ1.1а",text:"Өөрийн нэр, гэр бүлээ хэлнэ"},
    {code:"НСХ1.1б",text:"Мэндлэх, баярлалаа гэх дадалтай"},
    {code:"НСХ1.2а",text:"Найз нартайгаа хамтран тоглоно"},
    {code:"НСХ1.2б",text:"Сэтгэл хөдлөл (баяр, гуниг) ялгана"}
  ],
  urlag: [
    {code:"УЗ1.1а",text:"Харандаа, бийрээр эмх замбараагүй зурна"},
    {code:"УЗ1.1б",text:"3 үндсэн өнгөөр зурна"},
    {code:"УЗ1.2а",text:"Цаас урж, наана"},
    {code:"УЗ1.3а",text:"Шавраар бөмбөлөг, урт хиам хийнэ"}
  ],
  hodolgoon: [
    {code:"ХЭМ1.1а",text:"Гарын сарвууг атгах, тэнийлгэх"},
    {code:"ХЭМ1.1б",text:"Алхах, гүйх, зогсох, эргэх"},
    {code:"ХЭМ1.2а",text:"2 хөл дээр газраас үсэрнэ"},
    {code:"ХЭМ1.2б",text:"Бөмбөг өнхрүүлэх, шидэх"}
  ],
  aa_uhaan: [
    {code:"ААУ1.1а",text:"Халуун, хурц, өндөр зүйлээс сэрэмжлэнэ"},
    {code:"ААУ1.2а",text:"Ээж, аав, багшийн туслалцаа гуйна"}
  ]
};

const GROUP_META = [
  {id:"baga",    name:"🧸 Бага (2-3)"},
  {id:"dund",    name:"🧒 Дунд (3-4)"},
  {id:"ahlah",   name:"👦 Ахлах (4-5)"},
  {id:"beltgel", name:"🎒 Бэлтгэл (5-6)"}
];

// Бүх бүлгийн СҮД: OUTCOMES_REAL байвал ашиглана, үгүй бол Бага-с үүсгэнэ
const OUTCOMES = {};
GROUP_META.forEach((gm, i) => {
  if (window.OUTCOMES_REAL && window.OUTCOMES_REAL[gm.id]) {
    OUTCOMES[gm.id] = window.OUTCOMES_REAL[gm.id];
  } else if (gm.id === 'baga') {
    OUTCOMES[gm.id] = OUTCOMES_BAGA;
  } else {
    const lvl = i + 1;
    const out = {};
    Object.keys(OUTCOMES_BAGA).forEach(sid => {
      out[sid] = OUTCOMES_BAGA[sid].map(o => ({
        code: o.code.replace(/([А-ЯӨҮ]+)1\./, `$1${lvl}.`),
        text: o.text
      }));
    });
    OUTCOMES[gm.id] = out;
  }
});

const MONTHS = [
  {num:9,name:"IX"},{num:10,name:"X"},{num:11,name:"XI"},{num:12,name:"XII"},
  {num:1,name:"I"},{num:2,name:"II"},{num:3,name:"III"},{num:4,name:"IV"},{num:5,name:"V"}
];

// ═══════ АВТОМАТ ТӨЛӨВЛӨГӨӨ ҮҮСГЭХ ═══════
// Дүрэм: СҮД бүр жилдээ багтаад орж, зарим долоо хоногийн зөвхөн уялдаагаар давтагдана
function buildYearlyPlan(outcomes) {
  const subjectIds = Object.keys(outcomes);
  const totalWeeks = 36;
  const plan = {};
  const monthMap = [9,10,11,12,1,2,3,4,5];

  const schedules = {};
  subjectIds.forEach(sid => {
    const codes = outcomes[sid].map(o => o.code);
    if (!codes.length) return;
    const sched = [];
    const seen = new Set();
    // Түрүүлж бүх шинэ СҮД-ийг эхний ~N долоо хоногт хуваарилна, дараа нь давталт
    for (let w = 0; w < totalWeeks; w++) {
      if (w < codes.length) {
        sched.push({code: codes[w], isNew: true});
        seen.add(codes[w]);
      } else {
        // Давталт: цикл болгож нэг СҮД сонгоно, гэхдээ зарим долоо хоногийг хоосон үлдээж болно
        const skipRate = Math.max(1, Math.floor(totalWeeks / codes.length));
        if ((w - codes.length) % 2 === 0) {
          const idx = ((w - codes.length) / 2) % codes.length;
          sched.push({code: codes[idx], isNew: false});
        } else {
          sched.push(null); // Хоосон долоо хоног
        }
      }
    }
    schedules[sid] = sched;
  });

  for (let w = 0; w < totalWeeks; w++) {
    const month = monthMap[Math.floor(w/4)];
    const weekInMonth = (w % 4) + 1;
    const key = `${month}-${weekInMonth}`;
    const weekPlan = { new: {}, rep: {}, links: {} };
    const newCodes = [];
    subjectIds.forEach(sid => {
      const s = schedules[sid]; if (!s) return;
      const cell = s[w];
      if (!cell) return;
      if (cell.isNew) { weekPlan.new[sid] = cell.code; newCodes.push(cell.code); }
      else weekPlan.rep[sid] = cell.code;
    });
    // Уялдаа: бүх идэвхтэй СҮД шинэ СҮД-тэй холбогдоно
    Object.entries({...weekPlan.new, ...weekPlan.rep}).forEach(([sid, code], i) => {
      const others = newCodes.filter(c => c !== code);
      if (others.length > 0) weekPlan.links[code] = others[i % others.length];
    });
    plan[key] = weekPlan;
  }
  return plan;
}

// ═══════ ГЛОБАЛ ТӨЛӨВ ═══════
const YEARLY_PLAN = {};
Object.keys(OUTCOMES).forEach(g => YEARLY_PLAN[g] = buildYearlyPlan(OUTCOMES[g]));

let currentGroup = "baga";
let editMode = false;
let hasChanges = false;
let approvals = {}; // {group: {approved_at, approved_by}}
let editingCell = null; // {group, code, subjectId, weekKey}

// ═══════ ЭХЛЭЛ ═══════
async function init() {
  renderTabs();
  await loadFromDB();
  render();
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = GROUP_META.map(g =>
    `<button class="${g.id===currentGroup?'active':''}" onclick="switchGroup('${g.id}')">${g.name}</button>`
  ).join('');
}

function switchGroup(g) {
  if (hasChanges && !confirm('Хадгалаагүй өөрчлөлт байна. Үргэлжлүүлэх үү?')) return;
  currentGroup = g;
  hasChanges = false;
  document.getElementById('saveBtn').disabled = true;
  renderTabs();
  render();
}

function toggleEdit() {
  editMode = !editMode;
  document.getElementById('editBtn').textContent = editMode ? '✅ Дуусгах' : '✏️ Багш засах';
  document.getElementById('editBtn').style.background = editMode ? '#10b981' : '';
  document.getElementById('editBtn').style.color = editMode ? 'white' : '';
  render();
}

function render() {
  const g = currentGroup;
  const outcomes = OUTCOMES[g];
  const plan = YEARLY_PLAN[g];
  const totalWeeks = MONTHS.length * 4;

  // Approval status
  const ap = approvals[g];
  const badge = document.getElementById('statusBadge');
  if (ap && ap.approved_at) {
    badge.className = 'status approved';
    badge.textContent = `✅ Батласан: ${ap.approved_by||'арга зүйч'} · ${new Date(ap.approved_at).toLocaleDateString('mn-MN')}`;
    document.getElementById('approveBtn').style.display = 'none';
  } else {
    badge.className = 'status pending';
    badge.textContent = '⏳ Батлаагүй';
    document.getElementById('approveBtn').style.display = '';
  }

  let html = '<thead><tr><th rowspan="2" style="min-width:190px">СҮД / Долоо хоног</th>';
  MONTHS.forEach(m => html += `<th class="month" colspan="4">${m.name}</th>`);
  html += '</tr><tr>';
  MONTHS.forEach(_ => { for (let w=1; w<=4; w++) html += `<th>${w}</th>`; });
  html += '</tr></thead><tbody>';

  SUBJECTS_LIST.forEach(subj => {
    const list = outcomes[subj.id] || [];
    if (!list.length) return;
    html += `<tr class="subject-header"><th colspan="${totalWeeks+1}">${subj.name}</th></tr>`;
    list.forEach(o => {
      html += `<tr><th title="${o.text.replace(/"/g,'&quot;')}"><b>${o.code}</b><br><span style="font-weight:400;font-size:10px;color:#64748b">${o.text.substr(0,55)}${o.text.length>55?'…':''}</span></th>`;
      MONTHS.forEach(m => {
        for (let w=1; w<=4; w++) {
          const key = `${m.num}-${w}`;
          const cell = plan[key] || {new:{},rep:{},links:{}};
          let cls='empty', label='';
          if (cell.new[subj.id] === o.code) {
            cls='new';
            label = cell.links[o.code] || '●';
          } else if (cell.rep[subj.id] === o.code) {
            cls='rep';
            label = cell.links[o.code] || '↻';
          }
          const onclick = editMode ? `onclick="editCell('${subj.id}','${o.code}','${key}')"` : '';
          html += `<td class="${cls}" ${onclick} title="${o.code} · ${m.name}/${w}">${label}</td>`;
        }
      });
      html += '</tr>';
    });
  });
  html += '</tbody>';
  const tbl = document.getElementById('matrix');
  tbl.innerHTML = html;
  tbl.className = 'matrix' + (editMode ? ' edit-mode' : '');
}

// ═══════ ЗАСВАРЛАХ ═══════
function editCell(subjectId, code, weekKey) {
  const plan = YEARLY_PLAN[currentGroup][weekKey];
  const currentType = plan.new[subjectId] === code ? 'new' : plan.rep[subjectId] === code ? 'rep' : 'empty';
  const currentLink = plan.links[code] || '';

  editingCell = { subjectId, code, weekKey };
  document.getElementById('modalInfo').textContent = `${code} · ${weekKey.replace('-','/')} долоо хоног`;
  document.getElementById('cellType').value = currentType;

  // Link options: all other subjects' codes
  const linkSel = document.getElementById('cellLink');
  linkSel.innerHTML = '<option value="">— Үгүй —</option>';
  Object.entries(OUTCOMES[currentGroup]).forEach(([sid, list]) => {
    if (sid === subjectId) return;
    list.forEach(o => {
      linkSel.innerHTML += `<option value="${o.code}" ${o.code===currentLink?'selected':''}>${o.code} — ${o.text.substr(0,30)}</option>`;
    });
  });

  document.getElementById('modalBg').classList.add('show');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
  editingCell = null;
}

function saveCell() {
  if (!editingCell) return;
  const {subjectId, code, weekKey} = editingCell;
  const type = document.getElementById('cellType').value;
  const link = document.getElementById('cellLink').value;
  const plan = YEARLY_PLAN[currentGroup][weekKey];
  // Clear all previous entries for this subject in this cell
  delete plan.new[subjectId]; delete plan.rep[subjectId];
  if (type === 'new') plan.new[subjectId] = code;
  else if (type === 'rep') plan.rep[subjectId] = code;
  if (type !== 'empty') {
    if (link) plan.links[code] = link;
    else delete plan.links[code];
  } else {
    delete plan.links[code];
  }
  hasChanges = true;
  document.getElementById('saveBtn').disabled = false;
  closeModal();
  render();
}

// ═══════ SUPABASE ХАДГАЛАХ/АЧААЛАХ ═══════
async function loadFromDB() {
  if (!sb) return;
  try {
    const { data } = await sb.from('plans')
      .select('*')
      .eq('tab','yearly_matrix')
      .in('group_id', GROUP_META.map(g=>g.id));
    (data||[]).forEach(row => {
      try {
        const content = JSON.parse(row.content || '{}');
        if (content.plan) YEARLY_PLAN[row.group_id] = content.plan;
        if (row.approved_at) approvals[row.group_id] = {approved_at: row.approved_at, approved_by: row.approved_by};
      } catch(e) {}
    });
  } catch(e) { console.warn('Load failed:', e); }
}

async function save() {
  if (!sb) { showMsg('error', 'Supabase холбогдоогүй байна'); return; }
  const g = currentGroup;
  try {
    const content = JSON.stringify({ plan: YEARLY_PLAN[g] });
    const { data: existing } = await sb.from('plans')
      .select('id').eq('tab','yearly_matrix').eq('group_id',g).limit(1);
    if (existing && existing.length) {
      await sb.from('plans').update({content, title:`Жилийн матриц — ${g}`}).eq('id', existing[0].id);
    } else {
      await sb.from('plans').insert({group_id:g, tab:'yearly_matrix', title:`Жилийн матриц — ${g}`, content});
    }
    hasChanges = false;
    document.getElementById('saveBtn').disabled = true;
    showMsg('success', '✅ Хадгалагдлаа');
  } catch(e) {
    showMsg('error', 'Алдаа: ' + e.message);
  }
}

async function approve() {
  const name = prompt('Батлаж буй арга зүйчийн нэр:');
  if (!name) return;
  const g = currentGroup;
  const now = new Date().toISOString();
  approvals[g] = {approved_at: now, approved_by: name};
  if (sb) {
    try {
      const { data: existing } = await sb.from('plans')
        .select('id').eq('tab','yearly_matrix').eq('group_id',g).limit(1);
      if (existing && existing.length) {
        await sb.from('plans').update({approved_at: now, approved_by: name}).eq('id', existing[0].id);
      } else {
        await sb.from('plans').insert({group_id:g, tab:'yearly_matrix', title:`Жилийн матриц — ${g}`, content: JSON.stringify({plan: YEARLY_PLAN[g]}), approved_at: now, approved_by: name});
      }
      showMsg('success', '✅ Батласан');
    } catch(e) { showMsg('error', 'Алдаа: ' + e.message); }
  }
  render();
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

function downloadWord() {
  const g = currentGroup;
  const gname = GROUP_META.find(x=>x.id===g).name;
  const html = document.getElementById('matrix').outerHTML;
  const doc = `<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>
    table{border-collapse:collapse;font-family:Arial;font-size:9pt}th,td{border:1px solid #999;padding:3px;text-align:center}
    .new{background:#86efac}.rep{background:#93c5fd}.subject-header th{background:#fed7aa}
  </style></head><body><h2>Жилийн матриц — ${gname}</h2>${html}</body></html>`;
  const blob = new Blob([doc], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `yearly-matrix-${g}.doc`;
  a.click();
}

init();
</script>
