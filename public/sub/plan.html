let OVERRIDES = { 1:[], 2:[], 3:[], 4:[] };

async function loadOverrides() {
  const { data } = await sb.from('plan_matrix').select('*');
  OVERRIDES = { 1:[], 2:[], 3:[], 4:[] };
  for (const r of (data||[])) OVERRIDES[r.level] = r.overrides || [];
}
async function saveOverride(level, r, c, cell) {
  const arr = OVERRIDES[level].filter(x => !(x.r===r && x.c===c));
  if (cell.type || cell.code) arr.push({r, c, type:cell.type, code:cell.code});
  OVERRIDES[level] = arr;
  await sb.from('plan_matrix').upsert({level, overrides:arr, updated_at:new Date().toISOString()});
}

// Уялдааны кодуудын сан
const CROSS_CODES = {
  1: ["БНО1.1в","ХЯ1.1а","НСХ1.1а","БНО1.2д","ХЭМ1.1г"],
  2: ["БНО2.1в","ХЯ2.1а","НСХ2.1а","БНО2.2д","ХЭМ2.1г","ХЯ2.1б"],
  3: ["БНО3.1в","ХЯ3.1а","НСХ3.1а","БНО3.2д","ХЭМ3.1г","ХЯ3.1б","БНО3.2в"],
  4: ["БНО4.1в","ХЯ4.1а","НСХ4.1а","БНО4.2д","ХЭМ4.1г","ХЯ4.1б","БНО4.2в","ХЯ4.2в","ХЭМ4.2а","БНО4.1б"]
};

// Хүснэгт үүсгэх:
// - Мөр бүр 1 суралцахуйн үр дүн
// - Багана бүр 1 сар (9 сар)
// - Ногоон нүд: Шинэ мэдлэг оруулсан сар + уялдааны код гарна
// - Шар нүд: Давталт хийсэн сар (уялдааны код гарч болно)
// - Хоосон нүд: Тухайн сард энэ үр дүн ороогүй
function buildPlan(level, L) {
  const totalOutcomes = L.outcomes.length;
  const months = 9;
  const cross = CROSS_CODES[level];

  // Шинэ мэдлэгийг эхний хагас жилд тархаана
  // Тухайн үр дүн 1 сар шинэ, дараа нь 5-7 удаа давталт хийнэ
  const grid = L.outcomes.map((o, i) => {
    const row = new Array(months).fill(null);
    // Шинэ мэдлэг: outcome бүрийг ялгаж бүх сард тархаана
    const newMonth = Math.min(Math.floor(i * months / totalOutcomes), months-1);
    row[newMonth] = { type: 'n', code: cross[(i*2) % cross.length] };
    // Давталт: шинэ мэдлэгээс хойш эхлээд бататгах, өөр сард уялдуулах
    const repeatMonths = [];
    for (let m = 0; m < months; m++) if (m !== newMonth) repeatMonths.push(m);
    // 6-7 удаа давталт (сард 1) — үр дүн бүрд ойролцоогоор
    repeatMonths.forEach((m, idx) => {
      // Шинэ мэдлэгээс хойшхи 3 сар шууд бататгах
      if (m > newMonth) {
        row[m] = { type: 'd', code: cross[(i*2 + idx + 1) % cross.length] };
      } else if (m < newMonth) {
        // Шинэ мэдлэгээс өмнөх сар — хоосон (өөр үр дүн орж байгаа)
        row[m] = null;
      }
    });
    return { outcome:o, cells:row };
  });

  // Apply overrides
  const overs = OVERRIDES[level] || [];
  overs.forEach(o => {
    if (grid[o.r]) {
      if (!o.type && !o.code) grid[o.r].cells[o.c] = null;
      else grid[o.r].cells[o.c] = { type: o.type, code: o.code };
    }
  });
  return grid;
}

function render(level) {
  const L = LEVELS[level];
  const grid = buildPlan(level, L);
  const months = ["9","10","11","12","1","2","3","4","5"];
  const monthCount = 9;

  // Багана толгойн долоо хоногийн дугаар: 4 долоо хоног × 9 сар = 36
  // Гэхдээ сард нэг багана л харагдана
  const weekLabels = ["4","4","4","4","4","4","4","4","4"]; // 4 хичээл сард (2 хичээл × 2 долоо хоног ажлын үзүүлэлт)

  // Тоолуур
  const totalPerMonth = new Array(monthCount).fill(0);
  const newPerMonth = new Array(monthCount).fill(0);
  const repPerMonth = new Array(monthCount).fill(0);

        else repPerMonth[m]++;
      }
    });

      <div class="info">2026-2027 оны хичээлийн жил · 7 хоногт 2 сургалтын үйл ажиллагаа · Нийт 72 үйл ажиллагаа</div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:36px" rowspan="2">№</th>
          <th style="width:70px" rowspan="2">Ай</th>
          <th style="width:90px" rowspan="2">Дэд ай</th>
          <th style="width:340px" rowspan="2">Суралцахуйн үр дүн</th>
          <th colspan="${monthCount}">САР</th>
          <th style="width:80px" rowspan="2">Давтамж</th>
        </tr>
        <tr>${months.map(m=>`<th>${m}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${grid.map((row, i) => `
          <tr>
            <td>${i+1}</td>
            <td class="ai">Хөгжмийн илэрхийлэл</td>
            <td class="dai">${row.outcome.dai}</td>
            <td class="urdun"><strong>${row.outcome.code}.</strong> ${row.outcome.text}</td>
            ${row.cells.map((c, ci) => {
              const cls = c ? c.type : '';
              const code = c ? c.code : '';
              const clickAttr = EDIT_MODE ? `onclick="openCellEditor(${i},${ci},'${cls}','${code.replace(/'/g,"\\'")}')" style="cursor:pointer"` : '';
              return `<td class="${cls}" ${clickAttr}>${code}</td>`;
            }).join("")}
            <td><strong>${row.cells.filter(c=>c).length}</strong></td>
          </tr>
        `).join("")}
        <tr>
          <td colspan="4" class="foot-n" style="text-align:right;padding-right:12px">🟢 Шинэ СҮД (сар тус бүр)</td>
          ${newPerMonth.map(n => `<td class="foot-n">${n||''}</td>`).join("")}
          <td class="foot-n"><strong>${totalNew.reduce((a,b)=>a+b,0)}</strong></td>
        </tr>
        <tr>
          <td colspan="4" class="foot-d" style="text-align:right;padding-right:12px">🟡 Давталт (сар тус бүр)</td>
          ${repPerMonth.map(n => `<td class="foot-d">${n||''}</td>`).join("")}
          <td class="foot-d"><strong>${totalRow.reduce((a,b)=>a+b,0)}</strong></td>
        </tr>
        <tr>
          <td colspan="4" style="text-align:right;padding-right:12px;background:#f3f4f6"><strong>Нийт үзүүлэлт</strong></td>
          ${totalPerMonth.map(n => `<td style="background:#f3f4f6"><strong>${n}</strong></td>`).join("")}
          <td style="background:#f3f4f6"><strong>${grandTotal}</strong></td>
        </tr>
      </tbody>
    </table>

    <div class="legend">
      <div><span class="sw n"></span> <strong>🟢 Ногоон — Шинэ мэдлэг (СҮД)</strong> — тухайн үр дүнг шинээр таниулна</div>
      <div><span class="sw d"></span> <strong>🟡 Шар — Давталт</strong> — сурсан мэдлэгийг бататгана + бусад хичээлтэй уялдуулна</div>
    </div>

    <div class="note">
      <strong>Уялдаа холбоо:</strong> <strong>БНО</strong> — Байгаль нийгмийн орчин, <strong>ХЯ</strong> — Хэл яриа, <strong>НСХ</strong> — Нийгэм-сэтгэл хөдлөл, <strong>ХЭМ</strong> — Хэмжигдэхүүн (математик), <strong>ХӨГ</strong> — Хөгжим.<br>
      Шинэ мэдлэг олгосон үр дүн бүрийг сар бүрт давхар давталтаар бататгана. Долоо хоногт 2 сургалтын үйл ажиллагаа × 36 долоо хоног = <strong>нийт 72 үйл ажиллагаа</strong>.
    </div>

    <div class="sig">
      ХӨТӨЛБӨР БОЛОВСРУУЛСАН:<br>
      ХӨГЖМИЙН БАГШ <strong>Г.ӨЛЗИЙБАЯР</strong>
    </div>`;

  document.getElementById("plan").innerHTML = html;
  document.querySelectorAll(".toolbar a").forEach(a => a.classList.toggle("active", a.dataset.lvl === String(level)));
  document.title = `${L.title} — Жилийн төлөвлөлт 2026-2027`;
}

function currentLevel() {
  const h = parseInt(location.hash.replace("#","")) || 4;
  return [1,2,3,4].includes(h) ? h : 4;
}
function downloadCurrent() {
  const lvl = currentLevel();
  const names = {1:"бага",2:"дунд",3:"ахлах",4:"бэлтгэл"};
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `жилийн_төлөвлөлт_${names[lvl]}_2026_2027.html`;
  a.click();
  URL.revokeObjectURL(url);
}
window.addEventListener("hashchange", () => render(currentLevel()));
(async () => {
  try { await loadOverrides(); } catch(e) { console.error(e); }
  render(currentLevel());
})();
</script>
</body></html>
